name: Release Build

on:
  push:
    tags:
      - 'v*'

# Read by default; only the job that publishes the release needs write. No job
# here pushes to a registry, so the packages scope is gone.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Linux builds go through cargo-zigbuild so one ubuntu runner can target
  # every Pi and pin the glibc floor (see the `glibc` matrix field).
  ZIG_VERSION: 0.17.1
  ZIG_SHA256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
  CARGO_ZIGBUILD_VERSION: 0.24.1

jobs:
  # riku downloads java and clojure from the release tag of its own version,
  # so a tag that does not match the workspace version would point every
  # install at the wrong release.
  verify-version:
    name: Tag matches the workspace version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare tag and version
        run: |
          version=$(awk '/^\[workspace.package\]/{found=1; next} found && /^version/{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # `glibc` is appended to the zigbuild target only. The ubuntu runner
        # has a newer glibc than Debian 12 or Raspberry Pi OS, so gnu builds
        # link against 2.31 (Debian 11, Ubuntu 20.04) to start everywhere.
        # Output still lands in target/<plain triple>.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            glibc: '.2.31'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-amd64-musl
            glibc: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            glibc: '.2.31'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            glibc: ''
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            platform: linux-armv7
            glibc: '.2.31'
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            platform: linux-armv7-musl
            glibc: ''
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            platform: linux-armv6
            glibc: '.2.31'
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            platform: linux-armv6-musl
            glibc: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          target: ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          rm zig.tar.xz
          echo "$HOME/zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version "${CARGO_ZIGBUILD_VERSION}"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      # The release profile sets strip = true, so no separate strip step.
      - name: Build release (Linux)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target ${{ matrix.target }}${{ matrix.glibc }}

      - name: Build release (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/riku
            target/${{ matrix.target }}/release/rk
          retention-days: 30

      # Binary runtime plugins (downloaded by `riku install-plugins java|clojure`,
      # see crates/riku-cli/src/apps/install_plugins.rs): uploaded per-target so the CLI can fetch the
      # right one for the host triple from `releases/latest/download/riku-plugin-<name>-<target>`.
      - name: Upload plugin artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riku-plugin-bundle-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/riku-plugin-java
            target/${{ matrix.target }}/release/riku-plugin-clojure
          retention-days: 30

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create release archives
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            if [[ "$name" == riku-plugin-bundle-* ]]; then
              # Binary runtime plugins: ship raw (no tar.gz) so install_plugins.rs
              # can fetch+chmod them directly, matching the shell-plugin download path.
              target="${name#riku-plugin-bundle-}"
              for bin in "$dir"riku-plugin-*; do
                asset="riku-plugin-$(basename "$bin" | sed 's/^riku-plugin-//')-${target}"
                cp "$bin" "$asset"
                sha256sum "$asset" > "$asset.sha256"
              done
            else
              platform="${name#release-}"
              for bin in riku rk; do
                chmod +x "$dir$bin"
                tar --owner=0 --group=0 --numeric-owner -czf "$bin-$platform.tar.gz" -C "$dir" "$bin"
                sha256sum "$bin-$platform.tar.gz" > "$bin-$platform.sha256"
              done
            fi
          done
          rm -rf */
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          # An rc tag such as v0.1.4-rc.1 must never become "latest", which
          # is what the installer downloads by default.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
