name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Read-only by default so a compromised action cannot write to the repo. The
# release job elevates itself to contents: write, which is the only job that
# needs more.
permissions:
  contents: read

jobs:
  ci:
    name: CI (mise run ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # rust-toolchain.toml pins the channel; this guarantees the rustfmt and
      # clippy components are present for the pinned stable.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      # Restored before mise runs so that any helper tool it does have to
      # build from source can reuse the registry rather than refetching it.
      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # mise's cargo backend prefers cargo-binstall when it is on PATH, which
      # fetches the helper tools as prebuilt binaries. Without it each one is
      # compiled from source on every cache miss, which is where the crates.io
      # index timeouts have been landing.
      # Pinned to a commit, not a branch: a mutable ref on a third-party action
      # means whoever can push to it runs code in this job.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0

      # Installs mise and the helper tools declared in mise.toml
      # (nextest, llvm-cov, audit, deny); caches them between runs.
      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      # fmt:check + lint + build + test + test:doc + audit + deny.
      - name: Run CI pipeline
        run: mise run ci

      - name: Build release
        run: mise run build:release

  dashboard:
    name: Dashboard (nub)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Replaces actions/setup-node: installs nub (and Node) and caches the store.
      # working-directory is needed because defaults.run above does not apply to
      # action steps: without it the action looks for the Node pin at the repo
      # root, finds none, and leaves the job on the runner's host Node.
      - name: Install nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          working-directory: dashboard
          cache-dependency-path: dashboard/lock.yaml

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Type-check
        run: nub run typecheck

      - name: Unit tests
        run: nub run test:unit

      - name: Build
        run: nub run build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Build
        run: cargo build --release

      - name: Run deployment tests
        run: |
          chmod +x tests/deploy-smoke/test-all.sh
          ./tests/deploy-smoke/test-all.sh

      - name: Run quick test
        run: |
          chmod +x tests/deploy-smoke/quick-test.sh
          ./tests/deploy-smoke/quick-test.sh test-node node

  e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the e2e image
        run: docker build -f docker/Dockerfile.test -t riku-e2e:ci .

      - name: Run the e2e cases
        run: docker run --rm riku-e2e:ci

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ci, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build release binaries
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Create release archive
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czvf riku-${{ github.ref_name }}.tar.gz riku
          sha256sum riku-${{ github.ref_name }}.tar.gz > riku-${{ github.ref_name }}.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            target/x86_64-unknown-linux-gnu/release/riku-*.tar.gz
            target/x86_64-unknown-linux-gnu/release/riku-*.sha256
          generate_release_notes: true
          draft: false
