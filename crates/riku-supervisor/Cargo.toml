[package]
name = "riku-supervisor"
version = "0.1.0"
edition = "2021"
description = "Riku process supervisor: lifecycle, health, metrics, cron, log rotation"
authors = ["Rakibul Yeasin"]
repository = "https://github.com/dreygur/riku"
license = "MIT"

[dependencies]
riku-config = { path = "../riku-config" }
riku-util = { path = "../riku-util" }
riku-error = { path = "../riku-error" }
riku-nginx = { path = "../riku-nginx" }
riku-plugins = { path = "../riku-plugins" }
anyhow = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
nix = { workspace = true, features = ["signal", "process", "user", "fs", "resource", "sched", "mount"] }
libc = { workspace = true }
notify = "8"
rand = { workspace = true }
threadpool = "1"
tracing = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tower-http = { version = "0.5", features = ["cors"] }
toml = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tempfile = { workspace = true }
