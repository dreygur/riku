[package]
name = "riku-cli"
version = "0.1.0"
edition = "2021"
description = "Riku CLI provider layer: command handlers and argument parsing"
authors = ["Rakibul Yeasin"]
repository = "https://github.com/dreygur/riku"
license = "MIT"

[dependencies]
riku-config = { path = "../riku-config" }
riku-util = { path = "../riku-util" }
riku-nginx = { path = "../riku-nginx" }
riku-plugins = { path = "../riku-plugins" }
riku-supervisor = { path = "../riku-supervisor" }
riku-deploy = { path = "../riku-deploy" }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
dirs = "5"
glob = { workspace = true }
reqwest = { workspace = true }
nix = { workspace = true, features = ["signal", "process", "user", "fs"] }
which = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
