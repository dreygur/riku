[package]
name = "riku-sync"
version = "0.1.0"
edition = "2021"
description = "Riku file sync: manifest, transfer plan and verified apply without rsync"
authors = ["Rakibul Yeasin"]
repository = "https://github.com/dreygur/riku"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
tracing = { workspace = true }
zstd = "0.14.3"

[dev-dependencies]
riku-util = { path = "../riku-util" }
tempfile = { workspace = true }
