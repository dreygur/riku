[package]
name = "riku-container"
version = "0.1.0"
edition = "2021"
description = "Riku container services: engine driver, compose parsing and shared container types"
authors = ["Rakibul Yeasin"]
repository = "https://github.com/dreygur/riku"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
shlex = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
riku-config = { path = "../riku-config" }
riku-util = { path = "../riku-util" }

[dev-dependencies]
tempfile = { workspace = true }
