[package]
name = "riku-deploy"
version = "0.1.0"
edition = "2021"
description = "Riku deployment orchestration (service layer)"
authors = ["Rakibul Yeasin"]
repository = "https://github.com/dreygur/riku"
license = "MIT"

[dependencies]
riku-config = { path = "../riku-config" }
riku-util = { path = "../riku-util" }
riku-error = { path = "../riku-error" }
riku-nginx = { path = "../riku-nginx" }
riku-plugins = { path = "../riku-plugins" }
riku-supervisor = { path = "../riku-supervisor" }
anyhow = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["signal", "process", "user", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
glob = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
