[package]
name = "riku-plugins"
version = "0.1.0"
edition = "2021"
description = "Riku plugin system: discovery, manifest, marketplace, sandbox, signing"
authors = ["Rakibul Yeasin"]
repository = "https://github.com/dreygur/riku"
license = "MIT"

[dependencies]
riku-config = { path = "../riku-config" }
riku-util = { path = "../riku-util" }
riku-error = { path = "../riku-error" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
nix = { workspace = true, features = ["signal", "process", "user", "fs"] }
libc = { workspace = true }
tracing = { workspace = true }
once_cell = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = { workspace = true }

chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.5"
