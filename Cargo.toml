[workspace]
members = [
    "crates/riku",
    "crates/riku-config",
    "crates/riku-util",
    "crates/riku-http",
    "crates/riku-args",
    "crates/riku-remote",
    "crates/riku-client",
    "crates/riku-error",
    "crates/riku-nginx",
    "crates/riku-route",
    "crates/riku-caddy",
    "crates/riku-bundle",
    "crates/riku-plugins",
    "crates/riku-supervisor",
    "crates/riku-deploy",
    "crates/riku-cli",
    "crates/riku-dashboard",
    "crates/riku-plugin-java",
    "crates/riku-plugin-clojure",
    "crates/riku-container",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
glob = "0.3"
shlex = "2"
hex = "0.4"
libc = "0.2"
nix = { version = "0.31" }
once_cell = "1"
rand = "0.10"
# rustls with ring, no aws-lc. reqwest has no ring feature, so it gets no
# provider and riku-http installs ring before building any client.
reqwest = { version = "0.13", features = ["blocking", "json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
tracing = "0.1"
which = "8"

# opt-level "z": riku is mostly waiting on child processes, the engine and the
# network, so a smaller binary is worth more than faster code. panic stays
# "unwind": the supervisor catches panics in its threads and tasks and keeps
# running, and "abort" would take every managed app down with it.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[profile.test]
opt-level = 0
debug = true
