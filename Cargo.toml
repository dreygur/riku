[workspace]
members = [
    "crates/riku",
    "crates/riku-config",
    "crates/riku-util",
    "crates/riku-error",
    "crates/riku-nginx",
    "crates/riku-plugins",
    "crates/riku-supervisor",
    "crates/riku-deploy",
    "crates/riku-cli",
    "crates/riku-dashboard",
    "crates/riku-plugin-java",
    "crates/riku-plugin-clojure",
    "crates/riku-plugin-container",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
glob = "0.3"
hex = "0.4"
libc = "0.2"
nix = { version = "0.29" }
once_cell = "1"
rand = "0.8"
reqwest = { version = "0.13", features = ["blocking", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
tracing = "0.1"
which = "7"

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.test]
opt-level = 0
debug = true
